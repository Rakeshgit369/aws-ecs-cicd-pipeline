name: Weather App CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: weather-app
  ECS_CLUSTER: weather-app-cluster
  ECS_SERVICE: weather-app-service
  ECS_TASK_DEFINATION: weather-app-task-defination

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v
  deploy:
      needs: test
      runs-on: ubuntu-latest

      steps:
        - name: Checkout Code
          uses: actions/checkout@v3

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v1
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ env.AWS_REGION }}

        - name: Login to Amazon ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v1

        - name: Build and push backend image
          env:
            ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          run: |
            docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }} .
            docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

        - name: Download task definition
          run: |
            aws ecs describe-task-definition \
              --task-definition "${{ env.ECS_TASK_DEFINATION }}" \
              --region "${{ env.AWS_REGION }}" \
              --query taskDefinition \
              --output json > task-defination.json
        - name: Update ECS task definition
          id: task-def
          uses: aws-actions/amazon-ecs-render-task-definition@v1
          with:
            task-definition: task-defination.json
            container-name: weather-app
            image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

        - name: Deploy to Amazon ECS
          uses: aws-actions/amazon-ecs-deploy-task-definition@v1
          with:
            task-definition: ${{ steps.task-def.outputs.task-definition }}
            service: ${{ env.ECS_SERVICE }}
            cluster: ${{ env.ECS_CLUSTER }}
            wait-for-service-stability: true