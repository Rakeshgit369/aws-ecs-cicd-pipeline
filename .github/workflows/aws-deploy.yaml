name: Weather App CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: weather-app
  ECS_CLUSTER: weather-app-cluster
  ECS_SERVICE: weather-app-service
  ECS_TASK_DEFINATION: weather-app-task-defination
  ECS_SUBNETS: user-subnet
  ECS_SECURITY_GROUPS: user-security-group

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v
  deploy:
      needs: test
      runs-on: ubuntu-latest

      steps:
        - name: Checkout Code
          uses: actions/checkout@v3

        
        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v6.3.0
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ env.AWS_REGION }}
            unset-current-credentials: true
            translate-env-variables: false

        - name: Verify AWS identity
          run: aws sts get-caller-identity

        - name: Login to Amazon ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v1

        - name: Build and push backend image
          env:
            ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          run: |
            docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }} .
            docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

        - name: Download task definition
          run: |
            aws ecs describe-task-definition \
              --task-definition "${{ env.ECS_TASK_DEFINATION }}" \
              --region "${{ env.AWS_REGION }}" \
              --query taskDefinition \
              --output json > task-defination.json
        - name: Update ECS task definition
          id: task-def
          uses: aws-actions/amazon-ecs-render-task-definition@v1
          with:
            task-definition: task-defination.json
            container-name: weather-app
            image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

        - name: Deploy to Amazon ECS
          uses: aws-actions/amazon-ecs-deploy-task-definition@v1
          with:
            task-definition: ${{ steps.task-def.outputs.task-definition }}
            service: ${{ env.ECS_SERVICE }}
            cluster: ${{ env.ECS_CLUSTER }}
            wait-for-service-stability: true
            
        - name: Run Weather CLI on Fargate
          uses: aws-actions/amazon-ecs-deploy-task-definition@v2
          with:
            task-definition: ${{ steps.task-def.outputs.task-definition }}
            cluster: ${{ env.ECS_CLUSTER }}
            run-task: true
            run-task-launch-type: FARGATE
            run-task-subnets: ${{ vars.ECS_SUBNETS }}
            run-task-security-groups: ${{ vars.ECS_SECURITY_GROUPS }}
            run-task-assign-public-IP: ENABLED
            run-task-container-overrides: >-
              [{"name":"weather-app","command":["sh","-c","printf '%s\\n' 'Hyderabad' | python -m src.main"]}]
            wait-for-task-stopped: true
